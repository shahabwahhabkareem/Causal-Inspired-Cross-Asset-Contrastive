[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "c3m-farm"
version = "0.3.0"
description = "Auditable reference implementation of C3M-Farm for C-MAPSS predictive-maintenance experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "C3M-Farm Authors"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
c3m-train = "c3m_farm.cli:train_main"
c3m-audit = "c3m_farm.audit:main"
c3m-baseline = "c3m_farm.baseline_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/c3m_farm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
